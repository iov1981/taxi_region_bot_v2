<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#229ed9">
    <title>Такси Пензенской области</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="container">

    <!-- Шапка -->
    <div class="header">
        <div class="logo">🚕</div>
        <div class="header-text">
            <h1>Такси</h1>
            <p>Пензенская область</p>
        </div>
    </div>

    <!-- Маршрут -->
    <div class="card route-card">
        <div class="section-title">
            <span>📍</span>
            <span>Маршрут</span>
        </div>

        <!-- Откуда с кнопкой геолокации -->
        <div class="field-wrapper">
            <label for="from">Откуда</label>
            <div class="input-with-button" style="display: flex; gap: 8px; align-items: center;">
                <input
                    id="from"
                    type="text"
                    placeholder="Например: Терновского 162"
                    autocomplete="street-address"
                    style="flex: 1;"
                >
                <button
                    id="location-button"
                    class="icon-button"
                    type="button"
                    aria-label="Определить местоположение"
                    title="Моё местоположение"
                    style="padding: 0 14px; height: 46px; border-radius: 12px; border: 1px solid #ccc; background: var(--tg-theme-secondary-bg-color, #f0f2f5); cursor: pointer; font-size: 18px;"
                >
                    🎯
                </button>
            </div>
            <div id="location-status" class="field-hint" style="font-size: 12px; margin-top: 4px; color: var(--tg-theme-hint-color, #888); display: none;"></div>
        </div>

        <!-- Поменять местами -->
        <div class="swap-wrapper">
            <button
                id="swap-route"
                class="swap-button"
                type="button"
                aria-label="Поменять местами"
                title="Поменять местами"
            >
                ⇅
            </button>
        </div>

        <!-- Куда -->
        <div class="field-wrapper">
            <label for="to">Куда</label>
            <input
                id="to"
                type="text"
                placeholder="Например: Проспект Строителей 37"
                autocomplete="street-address"
            >
        </div>
    </div>

    <!-- Когда -->
    <div class="card">
        <div class="section-title">
            <span>🕐</span>
            <span>Когда</span>
        </div>

        <div class="quick-time">
            <button type="button" class="quick-time-button active" data-time="now">Сейчас</button>
            <button type="button" class="quick-time-button" data-time="30min">Через 30 минут</button>
            <button type="button" class="quick-time-button" data-time="tomorrow">Завтра</button>
        </div>

        <label for="date">Дата</label>
        <input id="date" type="date">

        <label for="time">Время</label>
        <input id="time" type="time">
    </div>

    <!-- Пассажиры -->
    <div class="card">
        <div class="section-title">
            <span>👤</span>
            <span>Пассажиры</span>
        </div>

        <div class="passengers">
            <button id="minus" type="button" aria-label="Уменьшить">−</button>
            <div class="passenger-count">
                <span id="passengers">1</span>
                <small>чел.</small>
            </div>
            <button id="plus" type="button" aria-label="Увеличить">+</button>
        </div>
    </div>

    <!-- Тариф -->
    <div class="card">
        <div class="section-title">
            <span>🚗</span>
            <span>Тариф</span>
        </div>
        <div class="economy-card">
            <div class="economy-icon">🚗</div>
            <div class="economy-info">
                <strong>Стандарт</strong>
                <span>Город и область</span>
            </div>
            <div class="economy-check">✓</div>
        </div>
    </div>

    <!-- Оплата -->
    <div class="card">
        <div class="section-title">
            <span>💳</span>
            <span>Способ оплаты</span>
        </div>

        <div class="payment-list">
            <button type="button" class="payment-option active" data-payment="cash">
                <span>💵</span>
                <span>Наличные</span>
            </button>
            <button type="button" class="payment-option" data-payment="card">
                <span>💳</span>
                <span>Карта</span>
            </button>
            <button type="button" class="payment-option" data-payment="sbp">
                <span>📱</span>
                <span>СБП</span>
            </button>
        </div>
    </div>

    <!-- Дополнительные опции и комментарий -->
    <div class="card">
        <div class="section-title">
            <span>✨</span>
            <span>Опции и пожелания</span>
        </div>

        <div class="comment-tags">
            <button type="button" class="tag" data-comment="Нужно детское кресло">👶 Детское кресло (+100 ₽)</button>
            <button type="button" class="tag" data-comment="Есть багаж">🧳 Багаж</button>
            <button type="button" class="tag" data-comment="Без животных">🐕 Без животных</button>
            <button type="button" class="tag" data-comment="Позвонить мне">📞 Позвонить мне</button>
        </div>

        <textarea id="comment" placeholder="Дополнительная информация (подъезд, багаж и т.д.)"></textarea>
    </div>

    <!-- Кнопка заказа -->
    <button id="order" class="order-button" type="button" disabled>
        🚕 Заказать
    </button>

    <div class="bottom-info">
        Стоимость рассчитывается автоматически по таксометру
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
